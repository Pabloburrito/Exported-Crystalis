html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #2a72a2; color: #f2e4c4; overflow: hidden; touch-action: none; }
#canvas { display: block; width: 100vw; height: 100vh; }
#canvas:focus { outline: none; }
#loader {
  position: fixed; inset: 0; z-index: 2;
  font-family: 'Monogram', ui-monospace, monospace;
  -webkit-font-smoothing: none;
  transition: opacity 600ms ease;
}
#loader.gone { opacity: 0; pointer-events: none; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
#logo {
  position: absolute; left: 50%; top: 9vh; transform: translateX(-50%);
  width: min(568px, 80vw); image-rendering: pixelated;
  filter: drop-shadow(0 5px 0 rgba(30, 60, 90, 0.25));
}
#panel {
  position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
  padding: 16px 20px 18px; background: #f2e4c4; color: #3a2a24;
  box-shadow: 0 -3px 0 #3a2a24, 0 3px 0 #3a2a24, -3px 0 0 #3a2a24, 3px 0 0 #3a2a24, 0 9px 0 rgba(15, 20, 40, 0.3);
}
#status { display: flex; justify-content: space-between; gap: 12px; font-size: 32px; line-height: 1; margin-bottom: 12px; }
#track { position: relative; height: 24px; }
#dots {
  position: absolute; left: 0; right: 0; top: 11px; height: 2px;
  background-image: var(--dots); background-size: 8px 2px; background-repeat: repeat-x;
  image-rendering: pixelated; opacity: 0.85;
}
#done { position: absolute; left: 0; top: 10px; height: 4px; width: 0; background: #c05546; }
#wing {
  position: absolute; top: 0; left: 0; width: 44px; height: 24px; margin-left: -22px;
  background: var(--wing) center / contain no-repeat; image-rendering: pixelated;
  filter: drop-shadow(2px 0 0 #3a2a24) drop-shadow(-2px 0 0 #3a2a24) drop-shadow(0 2px 0 #3a2a24) drop-shadow(0 -2px 0 #3a2a24);
  transition: left 200ms linear;
}
#tip { margin: 12px 0 0; font-size: 24px; line-height: 1; color: #704a48; min-height: 2em; }
#notice { display: none; font-size: 24px; line-height: 1.05; }
#notice b { display: block; font-weight: normal; font-size: 32px; margin-bottom: 8px; color: #963c36; }
#loader.failed #status, #loader.failed #track, #loader.failed #tip { display: none; }
#loader.failed #notice { display: block; }
@media (prefers-reduced-motion: reduce) { #wing { transition: none; } }
</style>

  const TIPS = ["Press G to open the Survey Lens and see how every machine is doing.", "Press B to open the Build menu.", "Press C to open the Island Tree at any time.", "Outlined trees and rocks never disappear.", "Sleeping in your bed starts a new day and saves the game.", "Shift-click Craft to make as many as your bag can pay for.", "The trader by the Core buys whatever you have too much of.", "A Miner placed right beside a rock mines it on its own."];
  const loader = document.getElementById('loader');
  const label = document.getElementById('label');
  const pct = document.getElementById('pct');
  const done = document.getElementById('done');
  const wing = document.getElementById('wing');
  const tip = document.getElementById('tip');
  const notice = document.getElementById('notice');
  loader.style.setProperty('--dots', 'url("' + SPRITES.route_dots + '")');
  loader.style.setProperty('--wing', 'url("' + SPRITES.wing + '")');

  let tipIndex = Math.floor(Math.random() * TIPS.length);
  function nextTip() { tip.textContent = 'Tip: ' + TIPS[tipIndex++ % TIPS.length]; }
  nextTip();
  const tipTimer = setInterval(nextTip, 7000);

  // --- The flight (flight.tscn / flight.gd) ---------------------------------
  const img = {};
  for (const k in SPRITES) { img[k] = new Image(); img[k].src = SPRITES[k]; }
  const sky = document.getElementById('sky');
  const logo = document.getElementById('logo');
  const panel = document.getElementById('panel');
  const ctx = sky.getContext('2d');
  const W = 640, H = 360;
  const CLOUDS = [['cloud_a', 80, 54], ['cloud_c', 230, 112], ['cloud_b', 420, 40], ['cloud_a', 590, 138], ['cloud_c', 340, 176]];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let running = true, bodyY = 157;
  const t0 = performance.now();

  function measureGap() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
    const k = Math.max(cw / W, ch / H), oy = (ch - H * k) / 2;
    const lr = logo.getBoundingClientRect(), pr = panel.getBoundingClientRect();
    bodyY = (lr.height > 0 && pr.height > 0 && pr.top > lr.bottom)
      ? Math.min((((lr.bottom + pr.top) / 2) * dpr - oy) / k, 230)
      : 157;
  }
  window.addEventListener('resize', measureGap);
  logo.addEventListener('load', measureGap);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureGap);
  measureGap();

  function ready(i) { return i && i.complete && i.naturalWidth > 0; }
  function strip(i, y, offset, h) {
    if (!ready(i)) return;
    const w = i.width;
    let x = -(((offset % w) + w) % w);
    for (; x < W; x += w) ctx.drawImage(i, 0, 0, w, h, x, y, w, h);
  }
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
    if (sky.width !== cw || sky.height !== ch) { sky.width = cw; sky.height = ch; }
    const t = reduced ? 0 : (now - t0) / 1000;
    const k = Math.max(cw / W, ch / H);
    const ox = (cw - W * k) / 2, oy = (ch - H * k) / 2;
    ctx.setTransform(k, 0, 0, k, ox, oy);
    ctx.imageSmoothingEnabled = false;
    if (ready(img.flight_sky)) ctx.drawImage(img.flight_sky, 0, 0); else { ctx.fillStyle = '#7fc0e8'; ctx.fillRect(0, 0, W, H); }
    strip(img.flight_farclouds, 200, t * 14, 70);
    strip(img.flight_islands, 243, t * 24, 28);
    if (ready(img.flight_sea)) ctx.drawImage(img.flight_sea, 0, 270);
    strip(img.flight_glints, 270, t * 130, 90);
    for (const [key, x0, y] of CLOUDS) {
      const c = img[key];
      if (!ready(c)) continue;
      let x = x0 - t * 70;
      x = ((((x + 80) % (W + 160)) + (W + 160)) % (W + 160)) - 80;
      ctx.drawImage(c, Math.round(x - c.width / 2), Math.round(y - c.height / 2));
    }
    const py = bodyY - 4 + Math.sin(t * 1.8) * 5;
    if (ready(img.plane_shadow)) {
      const s = img.plane_shadow;
      ctx.globalAlpha = 0.85;
      ctx.drawImage(s, 320 - s.width * 0.65, 290 - s.height * 0.65, s.width * 1.3, s.height * 1.3);
      ctx.globalAlpha = 1;
    }
    if (ready(img.puff)) {
      for (let i = 0; i < 18; i++) {
        const phase = (t / 1.3 + i / 18) % 1, age = phase * 1.3;
        const seed = Math.abs(Math.sin((Math.floor(t / 1.3 + i / 18) * 17 + i) * 12.9898) * 43758.5453) % 1;
        const size = 10 * (0.5 + seed * 0.5) * (1 + age * 0.6);
        ctx.globalAlpha = Math.max(0, 1 - age / 1.3) * 0.9;
        ctx.drawImage(img.puff, 320 - 56 - age * (40 + seed * 30) - size / 2, py + 1 + (seed - 0.5) * 10 * age - size / 2, size, size);
      }
      ctx.globalAlpha = 1;
    }
    if (ready(img.loading_plane)) {
      const p = img.loading_plane, fw = p.width / 2, f = Math.floor(t / 0.05) % 2;
      ctx.drawImage(p, f * fw, 0, fw, p.height, Math.round(320 - fw / 2), Math.round(py - p.height / 2), fw, p.height);
    }
  }
  requestAnimationFrame(frame);

  // --- Progress -------------------------------------------------------------
  function setProgress(ratio) {
    const v = Math.max(0, Math.min(1, ratio));
    done.style.width = (v * 100).toFixed(1) + '%';
    wing.style.left = (v * 100).toFixed(1) + '%';
    pct.textContent = Math.round(v * 100) + '%';
  }
  function finish() {
    label.textContent = 'Landing…';
    setProgress(1);
    clearInterval(tipTimer);
    window.removeEventListener('resize', measureGap);
    loader.classList.add('gone');
    setTimeout(() => { running = false; loader.remove(); }, 650);
  }
  function fail(err) {
    console.error(err);
    running = false;
    clearInterval(tipTimer);
    loader.classList.add('failed');
    const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong while starting the game.');
    notice.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = 'The flight was cancelled.';
    notice.appendChild(b);
    msg.split('\n').forEach((line) => { notice.appendChild(document.createTextNode(line)); notice.appendChild(document.createElement('br')); });
    notice.appendChild(document.createTextNode('Reloading the page usually helps. A recent desktop browser works best.'));
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('This browser is missing features the game needs:\n' + missing.join('\n'));
    return;
  }
  label.textContent = 'Flying to the island…';
  setProgress(0);
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) setProgress(current / total);
    },
  }).then(finish, fail);
}());
</script>
